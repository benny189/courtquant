repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]

      - id: mypy
        name: Mypy type checking
        entry: uv run mypy
        language: system
        pass_filenames: false

      - id: pytest
        name: Pytest test suite
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]