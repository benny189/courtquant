[project]
name = "courtquant"
version = "0.1.0"
description = "A reproducible probabilistic pricing and model-risk engine for handball goal markets."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Benjamin Schell", email = "127890644+benny189@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
keywords = [
    "probabilistic-modeling",
    "sports-analytics",
    "quantitative-finance",
    "model-risk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[project.urls]
Repository = "https://github.com/benny189/courtquant"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "scipy-stubs>=1.18.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["courtquant"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["src", "tests"]
exclude = ["^notebooks/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=courtquant",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["courtquant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
